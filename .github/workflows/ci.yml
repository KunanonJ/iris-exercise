# CI for the IRIS Learning Suite prototype.
# Continuous deploy is handled by Vercel Git integration:
#   production branch → Production
#   main / preview / other branches & PRs → Preview
# Manual Vercel CLI redeploy: .github/workflows/vercel.yml (workflow_dispatch).

name: CI

on:
  push:
    branches: [main, preview, production]
  pull_request:
    branches: [main, preview, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

permissions:
  contents: read

jobs:
  prototype:
    name: Prototype (types, lint, tests, evals, Next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    env:
      # Build-time placeholders — real Clerk/DB values live on Vercel.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?pgbouncer=true&connection_limit=1
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: prototype/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit --incremental false

      - name: Lint
        run: pnpm lint

      - name: Unit, auth, workflow & integration tests
        run: pnpm test

      - name: Offline AI evaluation (55 cases)
        run: pnpm eval --demo

      - name: Build Next.js (Vercel path)
        run: pnpm build

      - name: Scan client bundle for forbidden strings
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            let out = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(p));
              else if (/\.(js|html|css|json)$/.test(p)) out.push(p);
            }
            return out;
          }
          const roots = [".next/static", "public"].filter((d) => fs.existsSync(d));
          const files = roots.flatMap(walk);
          const forbidden = [
            "Somchai Jaidee",
            "Malee Suksan",
            "Arunee Srisuk",
            "MOODLE_A_TOKEN",
            "INTEGRATION_SECRET",
            "sk_live_",
            "sk_test_",
          ];
          for (const f of files) {
            const txt = fs.readFileSync(f, "utf8");
            for (const term of forbidden) {
              if (txt.includes(term)) throw new Error(`Forbidden string ${term} found in ${f}`);
            }
          }
          console.log(`Bundle check PASS across ${files.length} files in ${roots.join(", ") || "(none)"}`);
          JS

      - name: Production dependency audit
        run: pnpm audit --prod
        continue-on-error: true

  package:
    name: Model, PDF & credential scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python verification packages
        run: pip install --disable-pip-version-check openpyxl pypdf

      - name: Verify financial workbook caches & controls
        run: python3 model/verify_model.py model/cost-model.xlsx

      - name: Verify PDF, documentation links & secret scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import re, subprocess

          pdf = Path("IRIS-Learning-Suite-Launch-Plan-Kunanon-Jarat.pdf")
          reader = PdfReader(pdf)
          assert len(reader.pages) == 12, f"Expected 12 pages, got {len(reader.pages)}"
          for idx, page in enumerate(reader.pages):
              w, h = float(page.mediabox.width), float(page.mediabox.height)
              assert abs(w - 1920) < 1 and abs(h - 1080) < 1, f"Page {idx+1} size mismatch: {w}x{h}"
              assert len(page.extract_text()) > 500, f"Page {idx+1} has insufficient text"

          for name in ["README.md", "SUBMISSION.md", "prototype/README.md", "docs/implementation-progress.md", "docs/deployment.md", "model/README.md"]:
              doc = Path(name)
              if not doc.is_file():
                  continue
              for target in re.findall(r"\]\(([^)]+)\)", doc.read_text()):
                  if not target.startswith(("https:", "http:", "#", "<")) and not (doc.parent / target.split("#")[0]).exists():
                      raise RuntimeError(f"Broken file link in {name}: {target}")

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          patterns = [
              r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              r"\bsk_live_[A-Za-z0-9]{12,}",
              r"\bsk_test_[A-Za-z0-9]{12,}",
              r"\b(?:ghp_|github_pat_)[A-Za-z0-9_]{20,}",
              r"\bAKIA[A-Z0-9]{16}\b",
          ]
          findings = []
          for raw in paths:
              if not raw:
                  continue
              fp = Path(raw.decode())
              if fp.suffix in [".pdf", ".xlsx", ".png", ".woff2"] or not fp.is_file():
                  continue
              try:
                  s = fp.read_text()
              except UnicodeError:
                  continue
              if any(re.search(x, s) for x in patterns):
                  findings.append(str(fp))
          assert not findings, f"Credential scan failed: {findings}"
          print("PASS: 12-slide PDF, documentation links, and credential scan verified.")
          PY
          git diff --check

  cd-summary:
    name: CD summary (Vercel Git)
    needs: [prototype, package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize deploy path
        run: |
          {
            echo "### Continuous deploy"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Hosting: **Vercel** project \`iris-learning-suite\` (root \`prototype\`)"
            if [ "${{ github.ref_name }}" = "production" ]; then
              echo "- Target: **Production** → https://iris-learning-suite.vercel.app"
            else
              echo "- Target: **Preview** (native Git integration)"
            fi
            echo "- Manual CLI redeploy: Actions → **Vercel** → Run workflow"
            echo "- Optional Worker/D1 sandbox: \`pnpm deploy:worker\` (not part of this CD path)"
          } >> "$GITHUB_STEP_SUMMARY"
