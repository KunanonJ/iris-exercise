# Branch → Vercel environment mapping
#   main       → Preview  (integration / default Git branch)
#   preview    → Preview
#   production → Production
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Project rootDirectory on Vercel is `prototype`.
# Builds run on Vercel (remote) to avoid local CLI pnpm spawn issues.

name: Vercel

on:
  push:
    branches: [main, preview, production]
  pull_request:
    branches: [main, preview, production]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment: ${{ github.ref_name == 'production' && github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@41.7.8

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "production" ] && [ "${{ github.event_name }}" = "push" ]; then
            url=$(vercel deploy --yes --prod --token="$VERCEL_TOKEN")
            env_name=production
          else
            url=$(vercel deploy --yes --token="$VERCEL_TOKEN")
            env_name=preview
          fi
          {
            echo "environment=$env_name"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Deployed $url → $env_name"

      - name: Summary
        run: |
          {
            echo "### Vercel deploy"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Environment: \`${{ steps.deploy.outputs.environment }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
